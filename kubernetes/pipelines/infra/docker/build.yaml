apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations: {}
  generateName: docker-build-run-
  namespace: ${ENVIRONMENT}
spec:
  params:
    - name: flux-gitrepo-namespace
      value: ${ENVIRONMENT}
    - name: flux-gitrepo-name
      value: nguiland-ops-docker
    - name: context-dir
      value: .
    - name: always-build
      value: "false"
    - name: image-push-endpoint
      value: artifactory-jcr.${ENVIRONMENT}
  pipelineRef:
    name: docker-build
  taskRunTemplate:
    podTemplate:
      securityContext:
        fsGroup: 65532
    serviceAccountName: tekton-pipeline
  timeouts:
    pipeline: 1h0m0s
  workspaces:
    - name: source
      volumeClaimTemplate:
        metadata:
          creationTimestamp: null
          labels:
            tekton.dev/pvc-protection-finalizer: remove
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Mi
        status: {}
    - name: flux-manifests
      volumeClaimTemplate:
        metadata:
          creationTimestamp: null
          labels:
            tekton.dev/pvc-protection-finalizer: remove
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Mi
        status: {}
    - name: docker-config
      secret:
        secretName: docker-config
    - name: ssh-directory
      secret:
        secretName: ssh-credentials
